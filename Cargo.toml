[workspace]
members = [
    "kernel",
    "apps/hello",
    "apps/coreutils",
    "apps/sh",
    "apps/edit",
    "apps/libui",
    "apps/calc",
    "apps/fileman",
    "apps/notepad"
, "apps/beep", "apps/imgview"]
resolver = "2"

[profile.release]
lto = true
opt-level = 'z'
codegen-units = 1
panic = 'abort'
strip = true
